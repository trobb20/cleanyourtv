plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teddy.streamprobe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.teddy.streamprobe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Throwaway test build, sideloaded over ADB: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
