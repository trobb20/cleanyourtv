plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teddy.streamtotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.teddy.streamtotv'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the other add-ons.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3, the same version tv-hub uses: HLS and MPEG-TS playback on the TV's hardware decoder.
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    testImplementation 'junit:junit:4.13.2'
}
