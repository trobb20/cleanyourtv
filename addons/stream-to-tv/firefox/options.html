<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Stream to TV settings</h1>
  <p class="muted">Open Stream to TV on the TV; it shows its address and PIN.</p>
  <label>TV address <input id="address" placeholder="192.168.1.50:8642"></label>
  <label>PIN <input id="pin" inputmode="numeric" maxlength="4" placeholder="1234"></label>
  <button id="save">Save and test</button>
  <p id="result"></p>
  <script src="options.js"></script>
</body>
</html>
