plugins {
    id 'com.android.application'
}

android {
    namespace 'com.teddy.glance'
    compileSdk 34

    defaultConfig {
        applicationId 'com.teddy.glance'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.3'
    }

    signingConfigs {
        // Same key as the TV's launcher, so its READ_ROWS signature permission matches:
        // ORG_GRADLE_PROJECT_tvKeystore=~/.cleanyourtv/tv-launcher.keystore. Without it, the debug key.
        tv {
            def ks = providers.gradleProperty('tvKeystore').getOrNull()
            if (ks != null) {
                storeFile file(ks)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key.
            signingConfig providers.gradleProperty('tvKeystore').present ? signingConfigs.tv : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
